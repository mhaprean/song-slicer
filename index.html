<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Audio Cutter — slice loops from any song on a zoomable waveform and export WAV/MP3, entirely in your browser."
    />
    <title>Audio Cutter — Cut & Export Audio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236366f1'/%3E%3Cpath d='M12 22V10l10-2v11' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='10' cy='22' r='2.5' fill='white'/%3E%3Ccircle cx='20' cy='20' r='2.5' fill='white'/%3E%3C/svg%3E"
    />
    <style>
      /* Flash prevention: paint the app background before CSS loads */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #05070f;
        color-scheme: dark;
      }
    </style>
    <script>
      // Report runtime errors to the sandbox host when embedded in an iframe.
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener('error', function (event) {
          // Resource load errors have no message; only report JS runtime errors
          if (!event || !event.message) return;
          var key = event.message + '|' + (event.filename || '') + '|' + event.lineno;
          if (reported[key]) return; // same error only once, avoid render-loop spam
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: 'sandbox-runtime-error',
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || '',
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ''
                }
              },
              '*'
            );
          } catch (e) {
            /* reporting failures must never break the app */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
